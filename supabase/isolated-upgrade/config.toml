# Stack aislado SOLO para validación upgrade/recuperación hacia a14b4ce.
# No usar tc-erp-local (54322) ni tc-erp-isolated-verify (54332).
project_id = "tc-erp-isolated-upgrade"

[api]
enabled = true
port = 54341
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54342
shadow_port = 54340
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54343

[inbucket]
enabled = true
port = 54344

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

[analytics]
enabled = false
